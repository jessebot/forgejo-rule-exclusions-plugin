# -------------------------------------------------------------------------
# Allow editing/creating files even if they have code snippets
#
# example URI:
# /oeng/peertube-helm-chart/_edit/main/.forgejo/workflows/renovate.yml
#
# example content, renovate workflow:
#
# name: Renovate
# on:
#   workflow_dispatch:
#   schedule:
#   # This should be every hour
#   - cron: '40 * * * *'
#   push:
#     branches:
#       - main
#     paths:
#       - ".forgejo/renovate-config.json"
#       - ".forgejo/workflows/renovate.yml"
#       - "renovate.json"
#       - "scripts/**"
#
# jobs:
#   renovate:
#     if: ${{ forgejo.server_url }} == 'https://git.open.engineering'
#     uses: oeng/reusable-workflows/.forgejo/workflows/renovate.yaml@main
#     secrets: inherit
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/[a-zA-Z0-9\-]+/[a-zA-Z0-9\-]+/(_edit|_new)/.*/.*" \
    "id:9534125,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chains"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=930120;ARGS.content,\
        ctl:ruleRemoveTargetById=932125;ARGS.content,\
        ctl:ruleRemoveTargetById=932130;ARGS.content,\
        ctl:ruleRemoveTargetById=932160;ARGS.content,\
        ctl:ruleRemoveTargetById=932230;ARGS.content,\
        ctl:ruleRemoveTargetById=932235;ARGS.content,\
        ctl:ruleRemoveTargetById=932250;ARGS.content,\
        ctl:ruleRemoveTargetById=932260;ARGS.content,\
        ctl:ruleRemoveTargetById=932370;ARGS.content,\
        ctl:ruleRemoveTargetById=932380;ARGS.content,\
        ctl:ruleRemoveTargetById=933120;ARGS.content,\
        ctl:ruleRemoveTargetById=933135;ARGS.content,\
        ctl:ruleRemoveTargetById=933160;ARGS.content,\
        ctl:ruleRemoveTargetById=942360;ARGS.content,\
        ctl:ruleRemoveTargetById=942550;ARGS.content"

# -------------------------------------------------------------------------
# Allow users to push to repos
#  - 901340, Enabling body inspection
#  - 920420, Request content type is not allowed by policy
# Example request:
# Target Host: git.open.engineering
# Target path: /oeng/checkout-action/git-upload-pack
# Rule IDs: 901340, 920420, 949110, 980170, 920450
# it's also normal for the content-encoding header to be used here
# TODO: can't seem to make this work though:
# ctl:ruleRemoveTargetById=920450;REQUEST_HEADERS:content-encoding,
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /git-upload-pack" \
    "id:9534126,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveById=920450,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/x-git-upload-pack-request| |application/x-git-receive-pack-request| |application/x-git-upload-pack-result|'"

# -------------------------------------------------------------------------
# Similar to the above, but slightly different, this is for runners inspecting repos
# another example:
# URI: /oeng/doc-sites/info/refs?service=git-upload-pack
# origin_Content-Type: "application/x-git-upload-pack-advertisement",
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith info/refs\?service=git-upload-pack" \
    "id:9534127,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/x-git-upload-pack-advertisement|'"

# -------------------------------------------------------------------------
# more forgejo runner normal activity
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /git-receive-pack" \
    "id:9534128,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/x-git-receive-pack-request|'"

# -------------------------------------------------------------------------
# allows users to update their pull request settings section for a given repo which includes a setting for "enable time tracking"
#
# example body will look like:
# enable_code=on&enable_projects=on&enable_releases=on&enable_packages=on&enable_issues=on&enable_external_tracker=false&enable_timetracker=on&allow_only_contributors_to_track_time=on&enable_issue_dependencies=on&external_tracker_url=&tracker_url_format=&external_tracker_regexp_pattern=&enable_pulls=on&pulls_allow_merge=on&pulls_allow_rebase=on&pulls_allow_rebase_merge=on&pulls_allow_squash=on&pulls_allow_fast_forward_only=on&pulls_allow_manual_merge=on&pulls_default_merge_style=squash&default_allow_maintainer_edit=on&pulls_allow_rebase_update=on&pulls_default_update_style=rebase&default_delete_branch_after_merge=on&enable_autodetect_manual_merge=on&enable_wiki=on&enable_external_wiki=false&external_wiki_url=
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@endsWith /settings/units" \
    "id:9534129,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=932370;ARGS_NAMES:enable_timetracker"

# -------------------------------------------------------------------------
# Allow users to have complicated code and markdown such as renovate
# version updates in their pull request descriptions that get sqaushed
# and merged as the commit message body. Example URI:
# /api/v1/repos/oeng/matrix-chart/pulls
#
# Addresses the rules:
# - 932140: Remote Command Execution: Windows FOR/IF Command Found
# - 932370: Remote Command Execution: Windows Command Injection
# - 932235: Remote Command Execution: Unix Command Injection (command without evasion)
# - 941180: Node-Validator Deny List Keywords
#
# example body that triggers this:
# │ Matched Data: if you want to rebase/retry this pr check this box --- this pr has been generated by (https://github.com/renovatebot/renovate).
# │ <!--renovate-debug:eyjjcmvhdgvksw5wzxiioii0my4yodgumcisinvwzgf0zwrjblzlcii6ijqzlji4oc4wiiwidgfyz2v0qnjhbmnoijoibwfpbiisimxhymvscyi6wyjwyxrjacjdfq== found
# │ within ARGS:json.body: this pr contains the following updates: | package | update | change | |---|---|---| |
# │ (https://funsoftware.tld/)((https://dev.funsoftware.tld/funsoftware/funsoftware)) | patch | `2.0.14` → `2.0.15` | --- > ⚠ **warning** > > some dependencies
# │ could not be looked up. check the warning logs for more information. --- ### configuration 📅 **schedule**:(utc) - branch creation - at any time(no
# │ schedule defined) - automerge - at any time(no schedule defined) 🚦 **automerge**: disabled by config. please merge this manually once you are satisfied…
# │ ♻ **rebasing**: whenever pr becomes conflicted or you tick the rebase/retry checkbox. 🔕 **ignore**: close this pr and you wont be reminded about this
# │ update again. --- - [ ] <!-- rebase-check -->if you want to rebase/retry this pr check this box --- this pr has been generated by
# │ (https://github.com/renovatebot/renovate).
# │ <!--renovate-debug:eyjjcmvhdgvksw5wzxiioii0my4yodgumcisinvwzgf0zwrjblzlcii6ijqzlji4oc4wiiwidgfyz2v0qnjhbmnoijoibwfpbiisimxhymvscyi6wyjwyxrjacjdfq==-->
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/api/v1/repos/.*/.*/pulls" \
    "id:9534130,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        nolog,\
        ctl:ruleRemoveTargetById=932140;ARGS:json.body,\
        ctl:ruleRemoveTargetById=932370;ARGS:json.body,\
        ctl:ruleRemoveTargetById=932235;ARGS:json.body,\
        ctl:ruleRemoveTargetById=941180;ARGS:json.body"

# -------------------------------------------------------------------------
# Same as above, but when the PR actually merges, it hits this endpoint
# Addresses the rules:
# - 932140: Remote Command Execution: Windows FOR/IF Command Found
# - 932370: Remote Command Execution: Windows Command Injection
# - 932235: Remote Command Execution: Unix Command Injection (command without evasion)
# - 941180: Node-Validator Deny List Keywords
# - 933120: PHP Injection Attack: Configuration Directive Found
#
# TODO: update these to all be ruleRemoveTargetById
#
# example uri: /oeng/matrix-chart/pulls/100/merge
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/.*/.*/pulls/[0-9]+/merge$" \
    "id:9534131,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=932230;ARGS:merge_message_field,\
        ctl:ruleRemoveById=932140,\
        ctl:ruleRemoveById=932370,\
        ctl:ruleRemoveById=932235,\
        ctl:ruleRemoveById=941180,\
        ctl:ruleRemoveById=933120,\
        ctl:ruleRemoveById=942151"

# -------------------------------------------------------------------------
# Allow a pull request to be updated which requires PATCH
# Example body match for the other rules this hits:
#
# This PR contains the following updates:
#
# | Package | Update | Change |
# |---|---|---|
# | seaweedfs | minor | `4.0.404` → `4.55.0` |
# | seaweedfs | minor | `4.0.377` → `4.55.0` |
# | seaweedfs | minor | `4.0.403` → `4.55.0` |
# | seaweedfs | major | `3.68.0` → `4.55.0` |
# | seaweedfs | minor | `4.0.379` → `4.55.0` |
#
# ---
#
# > ⚠ **Warning**
# >
# > Some dependencies could not be looked up. Check the warning logs for more information.
#
# ---
#
# ### Configuration
#
# 📅 **Schedule**: (UTC)
#
# - Branch creation
#   - At any time (no schedule defined)
# - Automerge
#   - At any time (no schedule defined)
#
# 🚦 **Automerge**: Disabled by config. Please merge this manually once you are satisfied.
#
