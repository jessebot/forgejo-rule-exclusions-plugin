# -------------------------------------------------------------------------
# Allow creating issues (even if they have code snippets in the description)
# Rule ID #920420 - request content not allowed
# Rule ID #932235 - Remote Command Execution: Unix Command Injection
# Rule ID #932160 - Remote Command Execution: Unix Shell Code Found Event
# Rule ID #932130 - Remote Command Execution: Unix Shell Expression Found
# Rule ID #932260 - Remote Command Execution: Direct Unix Command Execution
# Rule ID #930120 - OS File Access Attempt
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^\/.*\/.*\/issues\/new$" \
    "id:9534112,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=932235,\
    ctl:ruleRemoveById=932160,\
    ctl:ruleRemoveById=932130,\
    ctl:ruleRemoveById=930120,\
    ctl:ruleRemoveById=932260,\
    setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/proto|'"

# -------------------------------------------------------------------------
# Allow creating topics
# Rule ID #920420 - request content not allowed
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^\/.*\/.*\/topics.*" \
    "id:9534113,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/proto|'"

# -------------------------------------------------------------------------
# Allow editing issues, the description content of which could be anything
# by the nature of it being a git forge where someone may be describing an
# exploit or complex code
#
# example uri: /repo-owner/repo/issues/295/content
#
# Prevents issues with the following rules:
# - #932230 Remote Command Execution: Unix Command Injection (2-3 chars)
# - #932235 Remote Command Execution: Unix Command Injection
# - #932160 Remote Command Execution: Unix Shell Code Found Event
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/.*/.*/issues/[0-9]+/content$" \
    "id:9534114,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=932230;ARGS:content,\
        ctl:ruleRemoveTargetById=932235;ARGS:content,\
        ctl:ruleRemoveTargetById=932160;ARGS:content"

