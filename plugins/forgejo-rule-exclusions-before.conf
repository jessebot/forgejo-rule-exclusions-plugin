# OWASP CRS Plugin
# Plugin name: forgejo-rule-exclusions-plugin
# Plugin description: Plugin to do rule exclusion of legit forgejo traffic
# Rule ID block base: 9,534,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable plugin
SecRule TX:forgejo-rule-exclusions-plugin_enabled "@eq 0" "id:9534099,phase:1,pass,nolog,ctl:ruleRemoveById=9500100-9500999"

# rule 9,534,100 : Detect ARGS forgejo-rule-exclusions-plugin-test-parameter and trigger alert if hit
SecRule ARGS:forgejo-rule-exclusions-plugin-test-parameter "@rx ." \
	"id:9534100,\
	phase:2,\
	block,\
	t:none,\
	msg:'Detected presence of parameter forgejo-rule-exclusions-plugin-test-parameter',\
	logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
	tag:'application-multi',\
	tag:'language-multi',\
	tag:'platform-multi',\
	tag:'attack-protocol',\
	tag:'paranoia-level/1',\
	tag:'OWASP_CRS',\
	tag:'capec/FIXME',\
	tag:'forgejo-rule-exclusions-plugin',\
        ver:'forgejo-rule-exclusions-plugin/1.0.0',\
	severity:'CRITICAL',\
	setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# [ Local CRS initialization ]
#
# We need to initialize some of the CRS variables also here because plugin setup runs before
# CRS initialization (this is a known limitation of the current plugin architecture). Must be
# kept in sync with CRS default setting.

# Copy of CRS rule 901160.
SecRule &TX:allowed_methods "@eq 0" \
    "id:9534101,\
    phase:1,\
    pass,\
    nolog,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"


# Copy of CRS rule 901162.
SecRule &TX:allowed_request_content_type "@eq 0" \
    "id:9534102,\
    phase:1,\
    pass,\
    nolog,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json|'"


# -------------------------------------------------------------------------
# For logging in with Oauth
# Prevent false positives for Server Side Request Forgery (SSRF) Attack
# Rule ID #934110
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^\/login\/oauth\/authorize.*" \
    "id:9534103,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=934110"

# -------------------------------------------------------------------------
# Allow user deleting their own SSH or GPG key
# this is for the /user/settings/keys/delete?type=ssh endpoint
# Rule ID #920420 - request content not allowed
# Rule ID #932250 - unix execution (it thinks ssh is a command)
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx ^/user/settings/keys/delete\?type=(?:ssh|gpg)$" \
    "id:9534104,\
    phase:1,\
    ver:'forgejo-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    ctl:ruleRemoveById=932250,\
    setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/x-git-upload-pack-request| |application/x-git-receive-pack-request|'"

